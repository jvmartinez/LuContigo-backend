services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medicita
      POSTGRES_PASSWORD: medicita
      POSTGRES_DB: medicita
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medicita']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'

  api:
    build: .
    profiles: ['api']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://medicita:medicita@postgres:5432/medicita
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
